spring.application.name=stillstay-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stillstay?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

smart-itinerary.pace.meal-break-buffer-minutes=${ITINERARY_MEAL_BREAK_BUFFER_MINUTES:90}
smart-itinerary.pace.default-travel-minutes=${ITINERARY_DEFAULT_TRAVEL_MINUTES:30}
